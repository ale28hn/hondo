var Sound={ctx:null,master:null,sfxG:null,musG:null,noiseBuf:null,vol:0.8,mus:0.5,drone:[],biome:-1,boss:false,nextNote:0,step:0,
 init:function(){if(this.ctx)return;try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;var c=new AC();this.ctx=c;
   this.master=c.createGain();this.master.connect(c.destination);this.sfxG=c.createGain();this.sfxG.connect(this.master);this.musG=c.createGain();this.musG.connect(this.master);
   // simple echo for music
   var d=c.createDelay(1);d.delayTime.value=0.38;var fb=c.createGain();fb.gain.value=0.35;var wet=c.createGain();wet.gain.value=0.4;this.musIn=c.createGain();this.musIn.connect(this.musG);this.musIn.connect(d);d.connect(fb);fb.connect(d);d.connect(wet);wet.connect(this.musG);
   var len=c.sampleRate*1;var b=c.createBuffer(1,len,c.sampleRate);var ch=b.getChannelData(0);for(var i=0;i<len;i++)ch[i]=Math.random()*2-1;this.noiseBuf=b;this.applyVol();}catch(e){this.ctx=null;}},
 resume:function(){try{if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();}catch(e){}},
 applyVol:function(){try{if(!this.ctx)return;this.master.gain.value=this.vol;this.musG.gain.value=this.mus*0.6;}catch(e){}},
 tone:function(f,dur,type,v,f2,delay,dest){try{var c=this.ctx;if(!c)return;var t=c.currentTime+(delay||0);var o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
   g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(dest||this.sfxG);o.start(t);o.stop(t+dur+0.02);}catch(e){}},
 noise:function(dur,freq,v,type,f2,delay){try{var c=this.ctx;if(!c)return;var t=c.currentTime+(delay||0);var s=c.createBufferSource();s.buffer=this.noiseBuf;var fl=c.createBiquadFilter();fl.type=type||'bandpass';fl.frequency.setValueAtTime(freq,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);fl.Q.value=1.2;
   var g=c.createGain();g.gain.setValueAtTime(v||0.3,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(fl);fl.connect(g);g.connect(this.sfxG);s.start(t,Math.random()*0.5);s.stop(t+dur+0.02);}catch(e){}},
 play:function(n){if(!this.ctx)return;try{switch(n){
  case 'jump':this.tone(220,0.12,'square',0.06,440);break;
  case 'dj':this.noise(0.18,1800,0.15,'bandpass',600);this.tone(330,0.15,'triangle',0.08,660);break;
  case 'land':this.noise(0.06,300,0.12,'lowpass');break;
  case 'swing':this.noise(0.09,2500,0.18,'bandpass',900);break;
  case 'hit':this.noise(0.12,900,0.35,'lowpass',200);this.tone(140,0.1,'square',0.12,60);break;
  case 'clink':this.tone(1400,0.12,'triangle',0.15,1100);this.tone(2100,0.08,'sine',0.08);break;
  case 'kill':this.tone(500,0.2,'square',0.08,90);this.noise(0.2,600,0.2,'lowpass',100);break;
  case 'hurt':this.tone(180,0.35,'sawtooth',0.18,50);this.noise(0.3,500,0.35,'lowpass',80);break;
  case 'dash':this.noise(0.2,3000,0.2,'bandpass',500);break;
  case 'heal':this.tone(523,0.3,'sine',0.12,1046);this.tone(784,0.4,'sine',0.08,1568,0.08);break;
  case 'charge':this.tone(200,0.15,'sine',0.03,260);break;
  case 'spit':this.noise(0.15,1200,0.2,'bandpass',300);this.tone(300,0.12,'square',0.06,120);break;
  case 'seed':this.tone(1200+Math.random()*300,0.06,'sine',0.05);break;
  case 'pickup':[523,659,784,1046].forEach(function(f,i){Sound.tone(f,0.35,'triangle',0.1,null,i*0.09);});break;
  case 'bench':[262,330,392,523].forEach(function(f,i){Sound.tone(f,1.2,'sine',0.07,null,i*0.05);});break;
  case 'roar':this.tone(90,1.0,'sawtooth',0.2,40);this.noise(1.0,400,0.3,'lowpass',80);break;
  case 'tele':this.tone(880,0.08,'square',0.05);this.tone(880,0.08,'square',0.05,null,0.12);break;
  case 'boom':this.noise(0.5,200,0.5,'lowpass',40);this.tone(60,0.4,'sine',0.3,30);break;
  case 'break':this.noise(0.3,800,0.4,'lowpass',100);this.tone(120,0.2,'square',0.1,50);break;
  case 'menu':this.tone(660,0.05,'square',0.05);break;
  case 'ok':this.tone(660,0.08,'square',0.06);this.tone(990,0.1,'square',0.06,null,0.06);break;
  case 'die':this.tone(300,1.2,'triangle',0.15,60);this.noise(1.0,800,0.2,'lowpass',60);break;
  case 'win':[392,523,659,784,1046,1318].forEach(function(f,i){Sound.tone(f,0.9,'triangle',0.09,null,i*0.15);});break;
 }}catch(e){}},
 setBiome:function(b,boss){if(!this.ctx)return;if(b===this.biome&&boss===this.boss)return;this.biome=b;this.boss=boss;try{var c=this.ctx,t=c.currentTime;
   this.drone.forEach(function(d){try{d.g.gain.setTargetAtTime(0.0001,t,0.5);d.o.stop(t+2);}catch(e){}});this.drone=[];if(b<0)return;
   var roots=[[55,82.4],[61.7,92.5],[49,73.4]][b];if(boss)roots=[41.2,61.7];var self=this;
   roots.forEach(function(f,i){var o=c.createOscillator(),g=c.createGain(),fl=c.createBiquadFilter();o.type=boss?'sawtooth':'triangle';o.frequency.value=f;o.detune.value=i*7;fl.type='lowpass';fl.frequency.value=boss?500:300;
     g.gain.setValueAtTime(0.0001,t);g.gain.setTargetAtTime(boss?0.07:0.05,t,1.0);o.connect(fl);fl.connect(g);g.connect(self.musG);o.start();self.drone.push({o:o,g:g});});}catch(e){}},
 update:function(){if(!this.ctx||this.biome<0)return;try{var t=this.ctx.currentTime;if(t<this.nextNote)return;
   var scales=[[220,261.6,293.7,329.6,392,440],[233,277,311,349,415,466],[196,233,261.6,293.7,349,392]];var sc=scales[this.biome];
   if(this.boss){var b=[82.4,82.4,98,110][this.step%4];this.tone(b,0.18,'square',0.05,null,0,this.musIn);if(this.step%2===0)this.noise(0.05,200,0.08,'lowpass');this.step++;this.nextNote=t+0.22;return;}
   var f=choice(sc)*(Math.random()<0.3?2:1);this.tone(f,1.6,'sine',0.035,null,0,this.musIn);if(Math.random()<0.3)this.tone(f*1.5,1.4,'sine',0.02,null,0.2,this.musIn);this.nextNote=t+rnd(0.9,2.4);}catch(e){}}
};

var Input={held:{},pressed:{},released:{},scheme:'arrows',padPrev:{},anyPressed:false,
 keymap:{ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',KeyW:'up',KeyS:'down',KeyD:'right',
  KeyZ:'jump',Space:'jump',KeyX:'attack',KeyJ:'attack',KeyC:'dash',KeyK:'dash',KeyL:'heal',KeyF:'spit',KeyU:'spit',
  Tab:'map',KeyM:'map',Escape:'pause',KeyP:'pause',Enter:'confirm',NumpadEnter:'confirm',ShiftLeft:'dash',ShiftRight:'dash'},
 actOf:function(code){if(code==='KeyA')return this.scheme==='wasd'?'left':'heal';return this.keymap[code];},
 down:function(a){if(!this.held[a]){this.pressed[a]=true;}this.held[a]=true;this.anyPressed=true;},
 up:function(a){if(this.held[a])this.released[a]=true;this.held[a]=false;},
 init:function(){var self=this;
  window.addEventListener('keydown',function(e){var c=e.code;if(c==='KeyW'||c==='KeyS'||c==='KeyD')self.scheme='wasd';if(c.indexOf('Arrow')===0)self.scheme='arrows';
    var a=self.actOf(c);if(a){e.preventDefault();if(!e.repeat)self.down(a);}else self.anyPressed=true;try{Sound.init();Sound.resume();}catch(er){}},{passive:false});
  window.addEventListener('keyup',function(e){var c=e.code;var a=self.actOf(c);if(c==='KeyA'){self.up('left');self.up('heal');}if(a){e.preventDefault();self.up(a);}});
  window.addEventListener('blur',function(){for(var k in self.held)self.up(k);});
  window.addEventListener('pointerdown',function(){try{Sound.init();Sound.resume();}catch(er){}self.anyPressed=true;});},
 pollPad:function(){var pads;try{pads=navigator.getGamepads?navigator.getGamepads():[];}catch(e){return;}var p=null;for(var i=0;pads&&i<pads.length;i++)if(pads[i]&&pads[i].connected){p=pads[i];break;}if(!p)return;
  var B=function(i){return!!(p.buttons[i]&&p.buttons[i].pressed);};var ax=p.axes[0]||0,ay=p.axes[1]||0;
  var st={left:B(14)||ax<-0.4,right:B(15)||ax>0.4,up:B(12)||ay<-0.5,down:B(13)||ay>0.5,jump:B(0),attack:B(2),heal:B(1),dash:B(5)||B(7)||B(4),spit:B(3),map:B(8),pause:B(9),confirm:B(0)};
  for(var k in st){if(st[k]&&!this.padPrev[k]){this.down(k);try{Sound.init();Sound.resume();}catch(e){}}if(!st[k]&&this.padPrev[k])this.up(k);}this.padPrev=st;},
 endStep:function(){this.pressed={};this.released={};},
 hit:function(a){return!!this.pressed[a];}
};

};
function tileAt(room,tx,ty){if(tx>=0&&ty>=0&&tx<room.w&&ty<room.h)return room.t[ty*room.w+tx];var X=room.gx*RW+tx,Y=room.gy*RH+ty;var n=World.at(X,Y);if(!n)return '#';return n.t[(Y-n.gy*RH)*n.w+(X-n.gx*RW)];}
function isSolidC(c){return c==='#'||c==='B'||c==='A'||c==='g';}
function inBarrier(room,tx,ty){var b=room.def.barrier;if(!b)return false;for(var i=0;i<b.length;i++){var q=b[i];if(tx>=q[0]&&tx<q[0]+q[2]&&ty>=q[1]&&ty<q[1]+q[3])return true;}return false;}
function solidAt(room,tx,ty){if(isSolidC(tileAt(room,tx,ty)))return true;if(Game.barrier&&room===Game.room&&inBarrier(room,tx,ty))return true;return false;}
function solidPx(room,px,py){return solidAt(room,Math.floor(px/TS),Math.floor(py/TS));}
function moveBody(b,room,dt,noOneWay){var res={ground:false,ceil:false,wallL:false,wallR:false,hitX:false};var tx,ty,i;
 b.x+=b.vx*dt;var y0=Math.floor((b.y+0.5)/TS),y1=Math.floor((b.y+b.h-0.5)/TS);
 if(b.vx>0){tx=Math.floor((b.x+b.w)/TS);for(ty=y0;ty<=y1;ty++)if(solidAt(room,tx,ty)){b.x=tx*TS-b.w-0.01;res.hitX=res.wallR=true;b.vx=0;break;}}
 else if(b.vx<0){tx=Math.floor(b.x/TS);for(ty=y0;ty<=y1;ty++)if(solidAt(room,tx,ty)){b.x=(tx+1)*TS+0.01;res.hitX=res.wallL=true;b.vx=0;break;}}
 var prevB=b.y+b.h;b.y+=b.vy*dt;var x0=Math.floor((b.x+0.5)/TS),x1=Math.floor((b.x+b.w-0.5)/TS);
 if(b.vy>0){ty=Math.floor((b.y+b.h)/TS);for(tx=x0;tx<=x1;tx++){var c=tileAt(room,tx,ty);if(solidAt(room,tx,ty)||(!noOneWay&&c==='='&&prevB<=ty*TS+1&&!(b.dropT>0))){b.y=ty*TS-b.h;b.vy=0;res.ground=true;break;}}}
 else if(b.vy<0){ty=Math.floor(b.y/TS);for(tx=x0;tx<=x1;tx++)if(solidAt(room,tx,ty)){b.y=(ty+1)*TS+0.01;b.vy=0;res.ceil=true;break;}}
 return res;}
function groundBelow(b,room){var ty=Math.floor((b.y+b.h+1)/TS),x0=Math.floor((b.x+0.5)/TS),x1=Math.floor((b.x+b.w-0.5)/TS);for(var tx=x0;tx<=x1;tx++){var c=tileAt(room,tx,ty);if(solidAt(room,tx,ty)||(c==='='&&Math.abs(b.y+b.h-ty*TS)<1.5&&!(b.dropT>0)))return true;}return false;}
function wallSide(b,room,dir){var px=dir>0?b.x+b.w+1.5:b.x-1.5;for(var py=b.y+3;py<=b.y+b.h-3;py+=4)if(solidPx(room,px,py))return true;return solidPx(room,px,b.y+b.h-3);}
function hazardTouch(b,room){var x0=Math.floor((b.x+2)/TS),x1=Math.floor((b.x+b.w-2)/TS),y0=Math.floor((b.y+3)/TS),y1=Math.floor((b.y+b.h+1)/TS);
 for(var ty=y0;ty<=y1;ty++)for(var tx=x0;tx<=x1;tx++){var c=tileAt(room,tx,ty);if(c==='x'||c==='w')return c;}return null;}

// ---- Graphics quality (2 High, 1 Medium, 0 Low) with automatic downgrade when frames are slow ----
var Gfx={cap:2,ema:16.7,slowT:0,noAuto:false,
 level:function(){var s=Game&&Game.settings&&Game.settings.gfx;return s==='low'?0:s==='medium'?1:2;},
 q:function(){return Math.min(this.level(),this.cap);},
 reset:function(){this.cap=2;this.slowT=0;this.ema=16.7;},
 frame:function(ms){if(!(ms>0)||ms>250)return;this.ema=this.ema*0.94+ms*0.06;
  if(this.noAuto||Game.settings.gfxAuto===false)return;var q=this.q();
  if(q>0&&this.ema>23){this.slowT+=ms/1000;if(this.slowT>2.5){this.cap=q-1;this.slowT=0;this.ema=16.7;if(Game.state==='play')Game.toastMsg(T('gfx')+': '+T('gfx_'+['low','medium','high'][this.cap])+' (auto)');}}
  else this.slowT=Math.max(0,this.slowT-ms/3000);}};
function hexRGB(h){if(h.charAt(0)!=='#')return[255,255,255];if(h.length===4)h='#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];var n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}

var RoomFX={room:null,drops:[],flies:[],motes:[],falls:[],banners:[],rays:[],waters:[],
 build:function(room){this.room=room;var rng=mulberry(room.id.charCodeAt(0)*97+room.id.length*13+(room.id.charCodeAt(1)||0));var w=room.w,h=room.h,b=room.b,x,y;

  this.drops=[];this.flies=[];this.motes=[];this.falls=[];this.banners=[];this.rays=[];this.waters=[];
  var nf=b===1?16:b===0?6:4;for(var i=0;i<nf*4&&this.flies.length<nf;i++){x=rng()*w|0;y=rng()*h|0;if(open(x,y))this.flies.push({x:x*TS+10,y:y*TS+10,hx:x*TS+10,hy:y*TS+10,ph:rng()*20,c:b===1?choice(['#fff0a0','#d8ff80','#ffd36b']):b===0?'#9ffff0':'#ffb070'});}

  if(room.def.shaft&&!this.rays.length)this.rays.push({x0:180,x1:260,str:1});},
